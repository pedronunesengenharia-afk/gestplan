# =============================================================================
# GestPlan · publicar
#
# A cada `git push` na main: confere, aplica as migrações e sobe o site.
#
# A ORDEM NÃO É ARBITRÁRIA e é o motivo de este arquivo existir. Já quebrou
# três telas em produção — `pessoa_custo`, `afazer` e `afazer.empresa_id` —
# porque o `dist` subiu antes da migração. Coluna nova não atrapalha a tela
# antiga, que simplesmente não a pede; tela nova pedindo coluna que não existe
# quebra na cara de quem usa. Aqui a ordem deixa de depender de alguém lembrar.
#
# E a suíte de permissão passa a rodar ANTES de todo deploy de verdade, como o
# CLAUDE.md sempre mandou e nada impunha. Se ela falhar, o site não sobe.
#
# O QUE É SEGREDO E O QUE NÃO É. Só entra em `secrets` o que abre porta: as três
# credenciais de FTP, o token do Supabase, a senha do banco e a chave anônima.
#
# O ref do projeto, a URL e a pasta do site NÃO são segredo — o ref e a URL
# estão dentro do arquivo que todo navegador baixa, e a pasta é onde o site já
# mora. Então eles vêm escritos aqui como padrão, com `vars.X || 'valor'`: quem
# quiser apontar para outro ambiente cria a variável no repositório e ela
# ganha; quem não criar, publica mesmo assim.
#
# Isso não é preguiça de configurar — é a primeira execução deste fluxo tendo
# falhado exatamente por três variáveis vazias, com o erro aparecendo no
# `supabase db push` e a causa estando três abas adiante. Valor que não é
# segredo e tem um padrão óbvio não deveria ser um passo de instalação a mais
# para errar.
# =============================================================================

name: Publicar

on:
  push:
    branches: [main]
  # Permite disparar à mão pela aba Actions, sem precisar de um commit.
  workflow_dispatch:

# Dois pushes seguidos não podem publicar fora de ordem: o segundo cancela o
# primeiro em vez de os dois correrem para o mesmo FTP.
concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  conferir:
    name: Conferir
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Tipos
        run: npx tsc -b

      - name: Paleta de gráfico
        run: python3 ferramentas/validar_paleta.py

      - name: Migrações e as nove suítes
        env:
          PGPASSWORD: postgres
          PSQL: psql -q -v ON_ERROR_STOP=1 -h localhost -U postgres -d gestplan_teste
        run: |
          psql -h localhost -U postgres -c 'create database gestplan_teste'
          bash ferramentas/rodar_suites.sh

  # ---------------------------------------------------------------------------
  publicar:
    name: Publicar
    needs: conferir          # nada sobe se a conferência falhar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # --- 1 · BANCO PRIMEIRO --------------------------------------------
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Aplicar as migrações
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SENHA: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # SEM `supabase link`. O `db push` aceita `--project-ref` direto, e o
          # link so existiria para gravar num arquivo qual e o projeto — o que
          # nao serve de nada num runner que e apagado no fim.
          #
          # Vale mais do que economizar um passo: nem `link` nem `push` tem
          # `--yes`, os dois dependem de perceber que nao ha terminal para
          # perguntar. Um comando a menos e uma chance a menos de a publicacao
          # travar esperando alguem apertar Enter.
          supabase db push             --project-ref ${{ vars.SUPABASE_PROJECT_REF || 'xsznzzvutdlulkhslcuz' }}             --password "$SENHA"

      # --- 2 · E SÓ ENTÃO A TELA -----------------------------------------
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://xsznzzvutdlulkhslcuz.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Enviar para a Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVIDOR }}
          username: ${{ secrets.FTP_USUARIO }}
          password: ${{ secrets.FTP_SENHA }}
          port: 21
          # FTPS, e nao FTP puro. A porta e a mesma 21: o `ftps` aqui e o TLS
          # explicito, em que a conexao comeca em claro e sobe para cifrada
          # logo no inicio — que e o que a Hostinger oferece.
          #
          # Com `ftp` puro, usuario e senha viajam em texto aberto por toda a
          # internet a cada publicacao. Numa credencial que pode escrever no
          # site inteiro, isso nao e detalhe.
          #
          # Se algum dia recusar a conexao, `ftps-legacy` (TLS implicito, porta
          # 990) e a segunda tentativa. Voltar para `ftp` e a ultima, e vale
          # trocar a senha depois.
          protocol: ftps
          # A barra no fim importa nos dois: sem ela o FTP cria uma pasta
          # `dist` dentro do destino e o site abre em branco.
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_PASTA || '/public_html/' }}
          # Envia só o que mudou, comparando com o que já está lá. A primeira
          # publicação sobe tudo; as seguintes, alguns kB.
          state-name: .ftp-deploy-sync-state.json
